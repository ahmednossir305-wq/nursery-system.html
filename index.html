function wordsBelow1000(n) {
  const U = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const T = {2:'عشرون',3:'ثلاثون',4:'أربعون',5:'خمسون',6:'ستون',7:'سبعون',8:'ثمانون',9:'تسعون'};
  const H = {1:'مائة',2:'مائتان',3:'ثلاثمائة',4:'أربعمائة',5:'خمسمائة',6:'ستمائة',7:'سبعمائة',8:'ثمانمائة',9:'تسعمائة'};
  const parts = [], h = Math.floor(n / 100), r = n % 100;
  if (h) parts.push(H[h]);
  if (r) { if (r < 20) parts.push(U[r]); else { const u = r % 10; parts.push((u ? U[u] + ' و' : '') + T[Math.floor(r / 10)]); } }
  return parts.join(' و');
}
function amountWords(a) {
  let p = Math.floor(a), q = Math.round((a - p) * 100);
  if (q === 100) { p++; q = 0; }
  if (p >= 1000000) return '';
  if (!p && !q) return 'صفر جنيه';
  const out = [];
  if (p) {
    const th = Math.floor(p / 1000), rest = p % 1000, w = [];
    if (th) w.push(th === 1 ? 'ألف' : th === 2 ? 'ألفان' : th <= 10 ? wordsBelow1000(th) + ' آلاف' : wordsBelow1000(th) + ' ألف');
    if (rest) w.push(wordsBelow1000(rest));
    out.push(w.join(' و') + ' جنيه مصري');
  }
  if (q) out.push(wordsBelow1000(q) + ' قرشًا');
  return out.join(' و') + ' فقط لا غير';
}
async function hashPw(p) {
  const s = 'nursery|' + p;
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0;
  return 'x' + h;
}

function upsert(c, o) {
  const i = db[c].findIndex(x => x.id === o.id);
  if (i >= 0) db[c][i] = o; else db[c].push(o);

}

function pager(key, total) {
  const pages = Math.max(1, Math.ceil(total / PER));
  if (pages <= 1) return '';
  const cur = Math.min(ui[key].page, pages);
  let h = '<nav class="pager" aria-label="الصفحات">';
  for (let i = 1; i <= pages; i++) h += `<button type="button" class="${i === cur ? 'active' : ''}" data-act="page" data-k="${key}" data-p="${i}">${i}</button>`;
  return h + '</nav>';
}
function paged(key, arr) {
  const pages = Math.max(1, Math.ceil(arr.length / PER));
  ui[key].page = Math.min(Math.max(1, ui[key].page), pages);
  return arr.slice((ui[key].page - 1) * PER, ui[key].page * PER);
}

function journalRange() {

  const tin = rows.reduce((a, e) => a + e.in, 0), tout = rows.reduce((a, e) => a + e.out, 0);
  return {from, to, opening, rows, tin, tout};
}

  const sy = window.scrollY;
  draw();
  if (snap) {
    Object.keys(snap.vals).forEach(id => { const el = document.getElementById(id); if (el) el.value = snap.vals[id]; });
    if (snap.focus) { const el = document.getElementById(snap.focus); if (el) { el.focus(); try { if (snap.s) el.setSelectionRange(snap.s[0], snap.s[1]); } catch (e) {} } }

  restore(f) {

      if (!await askConfirm('سيتم استبدال كل البيانات الحالية بالنسخة المختارة. متأكد؟', 'استرجاع')) return;

};
function normalize(d) {
  const S = v => (v === undefined || v === null || v === 0 || v === '0') ? '' : String(v);
  const o = {name: d.name || db.name};
  COLLS.forEach(c => { o[c] = (d[c] || []).map((x, i) => ({...x, id: String(x.id), t: x.t || (i + 1)})); });
  o.students.forEach(s => { s.classId = S(s.classId); });
  o.receipts.forEach(r => { r.studentId = S(r.studentId); });
  o.expenses.forEach((x, i) => { x.typeId = S(x.typeId); if (!x.seq) x.seq = i + 1; });
  return o;
}
async function restoreBackup(d) {
  const o = normalize(d), jobs = [], prevName = me() ? me().username.toLowerCase() : '';
  COLLS.forEach(c => {
    const keep = new Set(o[c].map(x => x.id));
    db[c].filter(x => !keep.has(x.id)).forEach(x => jobs.push(() => store.collection(c).doc(x.id).delete()));
    o[c].forEach(x => { const {id, ...body} = x; jobs.push(() => store.collection(c).doc(id).set(body)); });
  });
  jobs.push(() => store.doc('meta/main').set({name: o.name}));
  try {
    await inChunks(jobs);
    COLLS.forEach(c => { db[c] = o[c]; }); db.name = o.name;
    const same = o.users.find(u => String(u.username).toLowerCase() === prevName);
    setUid(same ? same.id : null);
    flash('تم استرجاع النسخة الاحتياطية.');
  } catch (e) { flash('تعذر إكمال الاسترجاع. حاول مرة أخرى.', 'error'); }
  render();
}

  },
  backup() {
    const o = {v: 2, name: db.name}; COLLS.forEach(c => { o[c] = db[c]; });
    saveFile(`nursery-backup-${todayStr()}.json`, JSON.stringify(o, null, 2));
  }
};
root.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = acts[el.dataset.act]; if (a) a(el.dataset);
});
root.addEventListener('change', e => {
  const t = e.target; if (t.id) dirty.add(t.id);
  const el = t.closest('[data-change]'); if (!el) return;
  const k = el.dataset.change, v = id => (document.getElementById(id) || {}).value || '';
  if (k === 'stu-filter') { ui.stu.c = el.value; ui.stu.q = v('q'); ui.stu.page = 1; render(); }
  else if (k === 'rec-filter') { ui.rec.m = v('m'); ui.rec.p = v('p'); ui.rec.q = v('q'); ui.rec.page = 1; render(); }
  else if (k === 'rec-student') { const o = el.options[el.selectedIndex], amt = document.getElementById('amount'); if (amt && o && o.dataset.fee && amt.dataset.touched !== '1') amt.value = o.dataset.fee; }
  else if (k === 'exp-month') { if (/^\d{4}-\d{2}$/.test(el.value)) { ui.exp.month = el.value; ui.exp.page = 1; render(); } }
  else if (k === 'exp-type') { ui.exp.t = el.value; ui.exp.page = 1; render(); }
});
root.addEventListener('input', e => { if (e.target.id) dirty.add(e.target.id); if (e.target.id === 'amount') e.target.dataset.touched = '1'; });

/* ============ الاتصال بقاعدة البيانات ============ */
const FB = window.FIREBASE_CONFIG || {};
let mode = 'local', gate = '', fbAuth = null, fbAu = null, synced = false;

function fileDl() {
  return { save: async ({filename, data}) => {
    const ext = filename.split('.').pop().toLowerCase();
    const type = {json: 'application/json', csv: 'text/csv;charset=utf-8', html: 'text/html;charset=utf-8'}[ext] || 'application/octet-stream';
    const url = URL.createObjectURL(new Blob([data], {type})), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); return {status: 'saved'};
  } };
}
function makeLocalStore() {
  const KEY = 'nursery_cloudless_v2', ls = [];
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
  const write = o => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { throw {code: 'unavailable'}; } };
  const notify = () => ls.forEach(f => f());
  addEventListener('storage', e => { if (e.key === KEY) notify(); });
  const sc = c => ({docs: Object.entries(read()[c] || {}).map(([id, v]) => ({id, data: () => v})), metadata: {fromCache: false}});
  const sd = (c, id) => { const v = (read()[c] || {})[id]; return {exists: !!v, data: () => v}; };
  const dref = (c, id) => ({
    async set(b) { const a = read(); (a[c] = a[c] || {})[id] = JSON.parse(JSON.stringify(b)); write(a); notify(); },
    async delete() { const a = read(); if (a[c]) delete a[c][id]; write(a); notify(); },
    onSnapshot(cb) { const f = () => cb(sd(c, id)); ls.push(f); setTimeout(f, 0); return () => {}; }
  });
  return { collection: c => ({ doc: id => dref(c, id), onSnapshot(cb) { const f = () => cb(sc(c)); ls.push(f); setTimeout(f, 0); return () => {}; } }),
           doc: p => { const [c, id] = p.split('/'); return dref(c, id); } };
}
function makeFirestoreStore(fs, d) {
  const clean = b => JSON.parse(JSON.stringify(b));
  const snapOf = s => ({docs: s.docs.map(x => ({id: x.id, data: () => x.data()})), metadata: {fromCache: s.metadata.fromCache}});
  const dref = (c, id) => ({ set: b => fs.setDoc(fs.doc(d, c, id), clean(b)), delete: () => fs.deleteDoc(fs.doc(d, c, id)),
    onSnapshot: (cb, err) => fs.onSnapshot(fs.doc(d, c, id), {includeMetadataChanges: true}, s => cb({exists: s.exists(), data: () => s.data()}), err) });
  return { collection: c => ({ doc: id => dref(c, id), onSnapshot: (cb, err) => fs.onSnapshot(fs.collection(d, c), {includeMetadataChanges: true}, s => cb(snapOf(s)), err) }),
           doc: p => { const [c, id] = p.split('/'); return dref(c, id); } };
}
function startSync() {
  const fail = e => { bootError = (e && e.code === 'permission-denied') ? 'قاعدة البيانات رفضت الوصول. راجعي قواعد الأمان (Rules) في Firebase.' : 'تعذر الاتصال بقاعدة البيانات' + (e && e.code ? ' (' + e.code + ')' : ''); render(); };
  COLLS.forEach(n => store.collection(n).onSnapshot(snap => {
    db[n] = snap.docs.map(d => ({...d.data(), id: d.id}));
    if (!snap.metadata.fromCache) loaded.add(n);
    scheduleRender();
  }, fail));
  store.doc('meta/main').onSnapshot(s => { if (s.exists && s.data().name) db.name = s.data().name; scheduleRender(); }, fail);
  setTimeout(() => { if (!COLLS.every(c => loaded.has(c)) && !bootError) { bootError = 'تأخر الاتصال بقاعدة البيانات (v3)'; render(); } }, 15000);
}
async function bootFirebase() {
  mode = 'firebase';
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [app, fs, au] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    const a = app.initializeApp(FB.config);
    fbAu = au; fbAuth = au.getAuth(a); let fdb; try { fdb = fs.initializeFirestore(a, {experimentalAutoDetectLongPolling: true}); } catch (e) { fdb = fs.getFirestore(a); }
    store = makeFirestoreStore(fs, fdb);
    au.onAuthStateChanged(fbAuth, user => {
      if (user) { gate = 'ok'; if (!synced) { synced = true; startSync(); } } else gate = 'login';
      render();
    });
  } catch (e) { bootError = 'تعذر تحميل مكتبة قاعدة البيانات. تأكدي من الاتصال بالإنترنت.'; render(); }
}
forms.gate = async function (f) {
  try { await fbAu.signInWithEmailAndPassword(fbAuth, FB.siteEmail, f.get('sitepw')); }
  catch (e) { authError = (e && e.code === 'auth/network-request-failed') ? 'تعذر الاتصال بالإنترنت.' : 'كلمة سر الموقع غير صحيحة.'; render(); }
};
async function boot() {
  const c = window.claude;
  if (c) {
    mode = 'claude';
    try { store = await c.use('db'); dl = await c.use('downloads'); } catch (e) { store = null; }
    if (!store) { bootError = 'التخزين المشترك غير متاح في هذا العرض'; return render(); }
    return startSync();
  }
  dl = fileDl();
  if (FB.config && FB.config.apiKey) return bootFirebase();
  mode = 'local'; store = makeLocalStore(); startSync();
}
render();
boot();
</script>
